name: Visual Editor Preview Checks

on:
  push:
    branches:
      - preview/resource-navigation-gallery
  pull_request:
    branches:
      - preview/resource-navigation-gallery

permissions:
  contents: read

jobs:
  preview-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
